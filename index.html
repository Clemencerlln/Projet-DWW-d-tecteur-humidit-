<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Plantes - Monstera Deliciosa</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

<!-- rectangle de l'iPhone 16 : tout le contenu est DEDANS -->
<div class="iphone-16-frame">

    <h1>Mes plantes 🪴</h1>

<!-- on mmet un flèche à l'envert-->    
    <div class="back-arrow">←</div>

    <div class="plant-title">
        <h2>Monstera Deliciosa</h2>
        <p>Salon</p>
    </div>

    <div class="plant-image">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrg5fTLcVPVMhrXbXFXY5jCg-P7WdJrKGLXB7G-Y5izg&s=10" alt="Monstera Deliciosa">
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <div class="circle-humidity">18%</div>
            <span>Humidité du sol</span>
        </div>
        <div class="stat-card">
            <div class="circle-temperature">22°</div>
            <span>Température</span>
        </div>
    </div>

    <div class="water-alert">
        <p style="color: #d32e15;">Prochain arrosage : Aujourd’hui !</p>
    </div>

    <div class="nav-bar">
        <div class="nav-item">Accueil</div>
        <div class="nav-item">Mes plantes</div>
        <div class="nav-item">Calendrier</div>
        <div class="nav-item">Profil</div>
    </div>

</div> <!-- fin du cadre iPhone -->

</body>
</html>
